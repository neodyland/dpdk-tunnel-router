# dpdk-tunnel-router example running configuration
#
# Load with:
#   dpdk-tunnel-router ... -- --config config/example.conf
#   routerctl --file config/example.conf
#
# eth0 is DPDK port 0.  Adjust `port` and addresses for your lab.

set interfaces ethernet eth0 port 0
set interfaces ethernet eth0 mtu 9000
set interfaces ethernet eth0 address 192.0.2.1/24
set interfaces ethernet eth0 address 2001:db8:1::1/64
set interfaces ethernet eth0 vlan-id 10 address 192.168.10.1/24
set interfaces ethernet eth0 vlan-id 20 mtu 1500

set interfaces tunnel tun0 encapsulation etherip6
set interfaces tunnel tun0 remote 2001:db8:1::2
set interfaces tunnel tun0 local-address 2001:db8:1::1
set interfaces tunnel tun0 local-interface eth0
set interfaces tunnel tun0 mtu 9000
set interfaces tunnel tun0 tcp-mss auto
set interfaces tunnel tun0 address 10.0.0.1/30

# A layer-2 bridge.  eth0.20 is an untagged access-style VLAN member.
set interfaces bridge br0 children eth0.20
set interfaces bridge br0 mtu 1500

set protocols static route 0.0.0.0/0 via 192.0.2.254
