name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 1.2.3 (no leading v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdpdk-dev libnuma-dev \
            libelf-dev python3-pyelftools meson ninja-build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ -z "$version" ]]; then
            echo "empty version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          JOBS: "2"
        run: |
          ./scripts/build-deb.sh
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - name: Run tests against the packaged build
        run: make test

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dpdk-tunnel-router-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
